<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Succuleaf 數位分身 - 模組化版</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="loading-screen">
    <!-- <video id="loading-video" autoplay loop muted playsinline>
      <source src="./images/intro.mp4" type="video/mp4">
      您的瀏覽器不支援影片標籤。
    </video> -->

    <div class="loader-container">
      <div class="leaf-icon">🌿</div>
      <div class="progress-wrapper">
        <div id="loader-bar"></div>
      </div>
      <div id="loader-text">
        System Initializing...
        <br>
        <span id="loader-percent">0%</span>
      </div>
    </div>
    <div id="instructions">
      <!-- ⚡ 新增：面板右上角的 ✕ 關閉按鈕，只有手機展開時才會顯示（見 style.css） -->
      <button class="instructions-close-btn" aria-label="關閉說明">✕</button>
      <div id="desktop-instructions" style="display: none;">
        <h3>🌿 空間體驗</h3>
        <ul>
          <li><strong>休息片刻</strong> 按ESC </li>
          <li><strong>空間漫步</strong> 按方向鍵／英文模式下的 WASD </li>
          <li><strong>視角控制</strong> 擺動滑鼠環顧四周 </li>
          <!-- <li><strong>開關互動</strong> 單擊水龍頭 / 門 </li> -->
          <li><strong>透視/離開</strong> 雙擊畫面</li>
        </ul>
      </div>
      <div id="mobile-instructions" style="display: none;">
        <h3>🌿 隨身跨界</h3>
        <ul>
          <li><strong>觸控視角</strong> 單指滑動環顧四周 </li>
          <li><strong>空間行走</strong> 按住螢幕單指前進／雙指後退 </li>
          <!-- <li><strong>智能微控</strong> 單擊裝置開關水流 </li> -->
          <li><strong>透視選單</strong> 雙擊螢幕喚醒神之手 </li>
        </ul>
      </div>
    </div>
    <!-- ⚡ 新增：手機專用的左下角常駐收合按鈕，點擊可展開上方的 #instructions 面板 -->
    <button id="instructions-fab" aria-label="開啟操作說明">🌿</button>
  </div>

  <div id="crosshair"></div>
  <button id="exit-btn">
    <span class="exit-icon">🚪</span>
    <span>離開遊戲</span>
  </button>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // ── 裝置判斷：顯示對應的操作說明 ──
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      document.getElementById("desktop-instructions").style.display = isMobile ? "none" : "block";
      document.getElementById("mobile-instructions").style.display = isMobile ? "block" : "none";

      // ── 離開按鈕 ──
      const exitBtn = document.getElementById("exit-btn");

      if (exitBtn) {
        exitBtn.addEventListener("click", function () {
          // ⚡ exitApp() 現在定義在 main.js（<script type="module">）裡，
          // module 執行完會把它掛到 window.exitApp（見 main.js 檔尾）。
          // module script 預設會在 DOMContentLoaded 之前就執行完畢，
          // 所以正常情況下這裡一定找得到；仍保留防呆，避免 main.js
          // 載入失敗時整個按鈕沒反應又不知道原因。
          if (typeof window.exitApp === "function") {
            window.exitApp();
          } else {
            console.error("[離開遊戲] window.exitApp 尚未就緒，main.js 可能載入失敗或還沒執行完");
          }
        });
      }
    });
  </script>

  <script type="importmap">
  {
      "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/examples/jsm/loaders/DRACOLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/DRACOLoader.js",
          "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
          "three/examples/jsm/loaders/RGBELoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/RGBELoader.js",
          "three/examples/jsm/controls/PointerLockControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/PointerLockControls.js",
          "three/examples/jsm/renderers/CSS2DRenderer.js": "https://unpkg.com/three@0.160.0/examples/jsm/renderers/CSS2DRenderer.js",
          "three/examples/jsm/postprocessing/EffectComposer.js": "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js",
          "three/examples/jsm/postprocessing/RenderPass.js": "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js",
          "three/examples/jsm/postprocessing/UnrealBloomPass.js": "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js",
          "three/examples/jsm/lights/RectAreaLightUniformsLib.js": "https://unpkg.com/three@0.160.0/examples/jsm/lights/RectAreaLightUniformsLib.js",
          "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js"
      }
  }
</script>

  <script type="module" src="./main.js?v=20260831"></script>
</body>

</html>
